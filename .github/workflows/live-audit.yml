name: Integration Live Audit

on:
  workflow_dispatch:
  workflow_call:

jobs:
  integration-live-audit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository without token
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config --global url.https://github.com/.insteadOf git@github.com:
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          if [ -n "${PR_NUMBER}" ]; then
            git fetch --no-tags --prune origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
            git checkout --detach "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --no-tags --prune origin "+${REF}:${REF}"
            git checkout --detach "${REF}"
          fi
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run integration live audit
        env:
          DAEWING_DIR: ${{ github.workspace }}/wing
          GO_BIN: go
          PNPM_BIN: pnpm
          AUDIT_ARTIFACT_DIR: ${{ runner.temp }}/live-audit-artifacts
        run: pnpm test:integration

      - name: Upload live audit artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-audit-artifacts
          path: ${{ runner.temp }}/live-audit-artifacts/**
          if-no-files-found: ignore
